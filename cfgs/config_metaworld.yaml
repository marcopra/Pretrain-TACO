defaults:
  - _self_
  - task@_global_: metaworld_push
  - agent@_global_: taco
  - override hydra/launcher: submitit_local

domain: metaworld
# environment settings
env_name: push-v2
camera: corner
resolution: 84

# task settings
frame_stack: 3
action_repeat: 2
discount: 0.99

# train settings
num_seed_frames: 3000
# eval
eval_every_frames: 10000
num_eval_episodes: 10
# snapshot
save_snapshot: true

# replay buffer
replay_buffer_size: 1000000
replay_buffer_num_workers: 4
nstep: 3
multistep: 3
batch_size: 256

# reward thresholds
medium_reward_threshold: 400

# misc
seed: 1
device: cuda
save_video: false
save_train_video: false
use_tb: true
use_wandb: false

# wandb
wandb_project: "taco_metaworld"
wandb_entity: "taco"
wandb_run_name: ${now:%Y.%m.%d}_${now:%H%M}_metaworld_${env_name}
# experiment
experiment: mw_exp

# agent
lr: 1e-4
encoder_lr: 1e-4
feature_dim: 50
exp_name: metaworld_default

num_train_frames: 500000

hydra:
  run:
    dir: ./exp_local/metaworld/${exp_name}_${env_name}
  sweep:
    dir: ./exp/${now:%Y.%m.%d}/${now:%H%M}_${agent_cfg.experiment}_${env_name}
    subdir: ${hydra.job.num}
  launcher:
    timeout_min: 4300
    cpus_per_task: 10
    gpus_per_node: 1
    tasks_per_node: 1
    mem_gb: 160
    nodes: 1
    submitit_folder: ./exp/${now:%Y.%m.%d}/${now:%H%M%S}_${agent_cfg.experiment}/.slurm
